<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradient for subtle color variations -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a4a5a" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#4a5a6a" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#3a4a5a" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Filter for subtle glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern for topographic elements -->
    <pattern id="topoPattern" patternUnits="userSpaceOnUse" width="1000" height="1000" patternTransform="scale(1) rotate(0)">
      <!-- Topographic contour lines - very subtle -->
      <g opacity="0.15">
        <!-- Main topographic features -->
        <path d="M0,300 C150,280 300,320 450,300 C600,280 750,320 900,300 C950,290 975,295 1000,300 L1000,200 C900,220 800,180 700,200 C600,220 500,180 400,200 C300,220 200,180 100,200 C50,210 25,205 0,200 Z" fill="none" stroke="#d3d9d4" stroke-width="0.5" />
        
        <path d="M0,380 C150,360 300,400 450,380 C600,360 750,400 900,380 C950,370 975,375 1000,380 L1000,280 C900,300 800,260 700,280 C600,300 500,260 400,280 C300,300 200,260 100,280 C50,290 25,285 0,280 Z" fill="none" stroke="#d3d9d4" stroke-width="0.5" />
        
        <path d="M0,460 C150,440 300,480 450,460 C600,440 750,480 900,460 C950,450 975,455 1000,460 L1000,360 C900,380 800,340 700,360 C600,380 500,340 400,360 C300,380 200,340 100,360 C50,370 25,365 0,360 Z" fill="none" stroke="#d3d9d4" stroke-width="0.5" />
        
        <path d="M0,540 C150,520 300,560 450,540 C600,520 750,560 900,540 C950,530 975,535 1000,540 L1000,440 C900,460 800,420 700,440 C600,460 500,420 400,440 C300,460 200,420 100,440 C50,450 25,445 0,440 Z" fill="none" stroke="#d3d9d4" stroke-width="0.5" />
        
        <path d="M0,620 C150,600 300,640 450,620 C600,600 750,640 900,620 C950,610 975,615 1000,620 L1000,520 C900,540 800,500 700,520 C600,540 500,500 400,520 C300,540 200,500 100,520 C50,530 25,525 0,520 Z" fill="none" stroke="#d3d9d4" stroke-width="0.5" />
        
        <path d="M0,700 C150,680 300,720 450,700 C600,680 750,720 900,700 C950,690 975,695 1000,700 L1000,600 C900,620 800,580 700,600 C600,620 500,580 400,600 C300,620 200,580 100,600 C50,610 25,605 0,600 Z" fill="none" stroke="#d3d9d4" stroke-width="0.5" />
      </g>
    </pattern>
    
    <!-- Pattern for data visualization elements -->
    <pattern id="dataPattern" patternUnits="userSpaceOnUse" width="1000" height="1000">
      <!-- Grid lines (very subtle) -->
      <g opacity="0.06">
        <!-- Horizontal grid lines -->
        <line x1="0" y1="100" x2="1000" y2="100" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="0" y1="200" x2="1000" y2="200" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="0" y1="300" x2="1000" y2="300" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="0" y1="400" x2="1000" y2="400" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="0" y1="500" x2="1000" y2="500" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="0" y1="600" x2="1000" y2="600" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="0" y1="700" x2="1000" y2="700" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="0" y1="800" x2="1000" y2="800" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="0" y1="900" x2="1000" y2="900" stroke="#d3d9d4" stroke-width="0.5" />
        
        <!-- Vertical grid lines -->
        <line x1="100" y1="0" x2="100" y2="1000" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="200" y1="0" x2="200" y2="1000" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="300" y1="0" x2="300" y2="1000" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="400" y1="0" x2="400" y2="1000" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="500" y1="0" x2="500" y2="1000" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="600" y1="0" x2="600" y2="1000" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="700" y1="0" x2="700" y2="1000" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="800" y1="0" x2="800" y2="1000" stroke="#d3d9d4" stroke-width="0.5" />
        <line x1="900" y1="0" x2="900" y2="1000" stroke="#d3d9d4" stroke-width="0.5" />
      </g>
      
      <!-- Data visualization elements -->
      <g opacity="0.2">
        <!-- Scatter plot points -->
        <circle cx="150" cy="350" r="1.5" fill="#d3d9d4" />
        <circle cx="220" cy="420" r="1.5" fill="#d3d9d4" />
        <circle cx="280" cy="370" r="1.5" fill="#d3d9d4" />
        <circle cx="340" cy="450" r="1.5" fill="#d3d9d4" />
        <circle cx="390" cy="380" r="1.5" fill="#d3d9d4" />
        <circle cx="460" cy="410" r="1.5" fill="#d3d9d4" />
        <circle cx="530" cy="360" r="1.5" fill="#d3d9d4" />
        <circle cx="590" cy="430" r="1.5" fill="#d3d9d4" />
        <circle cx="650" cy="380" r="1.5" fill="#d3d9d4" />
        <circle cx="710" cy="420" r="1.5" fill="#d3d9d4" />
        <circle cx="780" cy="370" r="1.5" fill="#d3d9d4" />
        <circle cx="850" cy="390" r="1.5" fill="#d3d9d4" />
        
        <!-- Line chart path -->
        <path d="M100,600 L150,580 L200,610 L250,590 L300,600 L350,570 L400,620 L450,590 L500,610 L550,580 L600,630 L650,600 L700,590 L750,610 L800,580 L850,620 L900,590" fill="none" stroke="#d3d9d4" stroke-width="1" opacity="0.4" />
        
        <!-- Bar chart (subtle blocks) -->
        <rect x="150" y="700" width="20" height="30" fill="#d3d9d4" opacity="0.3" />
        <rect x="200" y="700" width="20" height="45" fill="#d3d9d4" opacity="0.3" />
        <rect x="250" y="700" width="20" height="25" fill="#d3d9d4" opacity="0.3" />
        <rect x="300" y="700" width="20" height="40" fill="#d3d9d4" opacity="0.3" />
        <rect x="350" y="700" width="20" height="35" fill="#d3d9d4" opacity="0.3" />
        <rect x="400" y="700" width="20" height="50" fill="#d3d9d4" opacity="0.3" />
        <rect x="450" y="700" width="20" height="30" fill="#d3d9d4" opacity="0.3" />
        <rect x="500" y="700" width="20" height="45" fill="#d3d9d4" opacity="0.3" />
        <rect x="550" y="700" width="20" height="25" fill="#d3d9d4" opacity="0.3" />
        <rect x="600" y="700" width="20" height="40" fill="#d3d9d4" opacity="0.3" />
        <rect x="650" y="700" width="20" height="35" fill="#d3d9d4" opacity="0.3" />
        <rect x="700" y="700" width="20" height="50" fill="#d3d9d4" opacity="0.3" />
        
        <!-- GIS coordinate system markers -->
        <path d="M200,200 L205,200 M200,195 L200,205" stroke="#d3d9d4" stroke-width="0.7" />
        <path d="M400,200 L405,200 M400,195 L400,205" stroke="#d3d9d4" stroke-width="0.7" />
        <path d="M600,200 L605,200 M600,195 L600,205" stroke="#d3d9d4" stroke-width="0.7" />
        <path d="M800,200 L805,200 M800,195 L800,205" stroke="#d3d9d4" stroke-width="0.7" />
        
        <path d="M200,400 L205,400 M200,395 L200,405" stroke="#d3d9d4" stroke-width="0.7" />
        <path d="M400,400 L405,400 M400,395 L400,405" stroke="#d3d9d4" stroke-width="0.7" />
        <path d="M600,400 L605,400 M600,395 L600,405" stroke="#d3d9d4" stroke-width="0.7" />
        <path d="M800,400 L805,400 M800,395 L800,405" stroke="#d3d9d4" stroke-width="0.7" />
        
        <path d="M200,600 L205,600 M200,595 L200,605" stroke="#d3d9d4" stroke-width="0.7" />
        <path d="M400,600 L405,600 M400,595 L400,605" stroke="#d3d9d4" stroke-width="0.7" />
        <path d="M600,600 L605,600 M600,595 L600,605" stroke="#d3d9d4" stroke-width="0.7" />
        <path d="M800,600 L805,600 M800,595 L800,605" stroke="#d3d9d4" stroke-width="0.7" />
      </g>
      
      <!-- Network/graph connections -->
      <g opacity="0.1">
        <line x1="250" y1="250" x2="350" y2="300" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="250" y1="250" x2="300" y2="180" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="350" y1="300" x2="420" y2="250" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="300" y1="180" x2="420" y2="250" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="350" y1="300" x2="300" y2="350" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="420" y1="250" x2="470" y2="300" stroke="#d3d9d4" stroke-width="0.7" />
        
        <circle cx="250" cy="250" r="2" fill="#d3d9d4" />
        <circle cx="300" cy="180" r="2" fill="#d3d9d4" />
        <circle cx="350" cy="300" r="2" fill="#d3d9d4" />
        <circle cx="420" cy="250" r="2" fill="#d3d9d4" />
        <circle cx="300" cy="350" r="2" fill="#d3d9d4" />
        <circle cx="470" cy="300" r="2" fill="#d3d9d4" />
        
        <line x1="650" y1="250" x2="750" y2="300" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="650" y1="250" x2="700" y2="180" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="750" y1="300" x2="820" y2="250" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="700" y1="180" x2="820" y2="250" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="750" y1="300" x2="700" y2="350" stroke="#d3d9d4" stroke-width="0.7" />
        <line x1="820" y1="250" x2="870" y2="300" stroke="#d3d9d4" stroke-width="0.7" />
        
        <circle cx="650" cy="250" r="2" fill="#d3d9d4" />
        <circle cx="700" cy="180" r="2" fill="#d3d9d4" />
        <circle cx="750" cy="300" r="2" fill="#d3d9d4" />
        <circle cx="820" cy="250" r="2" fill="#d3d9d4" />
        <circle cx="700" cy="350" r="2" fill="#d3d9d4" />
        <circle cx="870" cy="300" r="2" fill="#d3d9d4" />
      </g>
    </pattern>
  </defs>
  
  <!-- Base background -->
  <rect width="100%" height="100%" fill="#2E3944" />
  
  <!-- Gradient overlay -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Patterns -->
  <rect width="100%" height="100%" fill="url(#topoPattern)" />
  <rect width="100%" height="100%" fill="url(#dataPattern)" />
  
  <!-- Highlight paths (data flow visualization) -->
  <g opacity="0.08" filter="url(#glow)">
    <path d="M0,200 C200,180 400,220 600,200 C800,180 1000,220 1000,200" stroke="#d3d9d4" stroke-width="1.2" fill="none" />
    <path d="M0,400 C200,380 400,420 600,400 C800,380 1000,420 1000,400" stroke="#d3d9d4" stroke-width="1.2" fill="none" />
    <path d="M0,600 C200,580 400,620 600,600 C800,580 1000,620 1000,600" stroke="#d3d9d4" stroke-width="1.2" fill="none" />
    <path d="M0,800 C200,780 400,820 600,800 C800,780 1000,820 1000,800" stroke="#d3d9d4" stroke-width="1.2" fill="none" />
  </g>
</svg>